<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRAH by Arabian AI – Hyper-Realistic Visuals for Luxury Brands</title>
    <meta name="description" content="Enterprise-ready AI engine for generating e-commerce product images and videos with 100% visual fidelity.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            950: '#022c22',
                        },
                        gold: {
                            DEFAULT: '#D4AF37',
                            hover: '#C5A028'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #ffffff;
            color: #022c22;
            scroll-behavior: smooth;
        }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .btn-luxury {
            transition: all 0.3s ease;
        }
        .btn-luxury:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(2, 44, 34, 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-lux-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #022c22; border-radius: 10px; }
    </style>
<script type="importmap">

    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}

</head>
