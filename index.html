<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRAH by Arabian AI | Hyper-Realistic Luxury Visuals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F9F9F9;
            --surface: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --gold: #D4AF37;
            --gold-soft: rgba(212, 175, 55, 0.1);
            --border: rgba(0, 0, 0, 0.06);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .text-gold { color: var(--gold); }
        .bg-gold { background-color: var(--gold); }
        .border-gold { border-color: var(--gold); }
        
        ::selection {
            background-color: var(--gold);
            color: #fff;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #DDD; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .gold-glow {
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }

        .gold-bg {
            background-color: var(--gold);
        }

        .soft-shadow {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        
        @keyframes subtleZoom {
          from { transform: scale(1); }
          to { transform: scale(1.05); }
        }
        .hero-zoom {
          animation: subtleZoom 15s infinite alternate ease-in-out;
        }

        /* Hover interaction using the subtleZoom keyframes' scale logic */
        .subtleZoom {
          transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .subtleZoom:hover {
          transform: scale(1.05);
        }

        .gold-gradient-text {
            background: linear-gradient(to right, #D4AF37, #B8860B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .card-hover {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
