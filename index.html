
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRAH | Luxury Visual Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            950: '#022c22',
                        },
                        gold: {
                            DEFAULT: '#D4AF37',
                            hover: '#C5A028'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2.5rem',
                        '5xl': '3.5rem',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #FFFFFF;
            --emerald-deep: #022c22;
            --gold: #D4AF37;
        }
        
        body {
            background-color: var(--bg);
            color: #111;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        .soft-shadow {
            box-shadow: 0 10px 40px rgba(2, 44, 34, 0.05);
        }

        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .btn-luxury {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-luxury:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-lux-in {
            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .gold-glow {
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
        }
        
        input, select, textarea {
            border: 1px solid #F3F4F6 !important;
            border-radius: 1.5rem !important;
            padding: 1rem 1.5rem !important;
            outline: none !important;
            background: #FAFAFA !important;
            transition: all 0.4s ease !important;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--gold) !important;
            background: #FFF !important;
            box-shadow: 0 0 0 1px var(--gold) !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
